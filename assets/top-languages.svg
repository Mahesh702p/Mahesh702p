<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 180" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .bg { fill: #0c1017; rx: 8px; ry: 8px; stroke: #1e293b; stroke-width: 1px; }
      .title { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
      .label { fill: #cbd5e1; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; }
      .pct { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; }
      
      .py { fill: #3572A5; }
      .js { fill: #f1e05a; }
      .cpp { fill: #f34b7d; }
      .html { fill: #e34c26; }
      .css { fill: #563d7c; }
      .sql { fill: #e38c00; }
    </style>
  </defs>

  <rect width="415" height="180" class="bg" />

  <!-- Title -->
  <text x="20" y="32" class="title">Most Used Languages</text>

  <!-- Progress Bar (Total width 375px) -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="195" height="10" rx="5" class="py" />
    <rect x="198" y="0" width="95" height="10" rx="0" class="js" />
    <rect x="296" y="0" width="45" height="10" rx="0" class="cpp" />
    <rect x="344" y="0" width="31" height="10" rx="5" class="html" />
  </g>

  <!-- Language Grid -->
  <g transform="translate(25, 80)">
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="12" r="5" class="py" />
      <text x="18" y="16" class="label">Python</text>
      <text x="85" y="16" class="pct">52.4%</text>
    </g>

    <g transform="translate(0, 30)">
      <circle cx="6" cy="12" r="5" class="js" />
      <text x="18" y="16" class="label">JavaScript</text>
      <text x="98" y="16" class="pct">24.8%</text>
    </g>

    <g transform="translate(0, 60)">
      <circle cx="6" cy="12" r="5" class="cpp" />
      <text x="18" y="16" class="label">C++</text>
      <text x="65" y="16" class="pct">14.2%</text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(200, 0)">
      <circle cx="6" cy="12" r="5" class="html" />
      <text x="18" y="16" class="label">HTML/CSS</text>
      <text x="95" y="16" class="pct">5.6%</text>
    </g>

    <g transform="translate(200, 30)">
      <circle cx="6" cy="12" r="5" class="sql" />
      <text x="18" y="16" class="label">SQL</text>
      <text x="65" y="16" class="pct">2.0%</text>
    </g>

    <g transform="translate(200, 60)">
      <circle cx="6" cy="12" r="5" class="css" />
      <text x="18" y="16" class="label">Shell</text>
      <text x="65" y="16" class="pct">1.0%</text>
    </g>
  </g>
</svg>
