    <g transform="translate(0, 48)">
      <path class="icon" d="M7 1c-1.1 0-2 .9-2 2 0 .7.4 1.3 1 1.7V7c0 1.1.9 2 2 2h1v1.3c-.6.4-1 1-1 1.7 0 1.1.9 2 2 2s2-.9 2-2c0-.7-.4-1.3-1-1.7V9c0-1.1-.9-2-2-2H9V4.7c.6-.4 1-1 1-1.7 0-1.1-.9-2-2-2z" transform="scale(0.8)"/>
      <text x="22" y="11" class="label">Total PRs:</text>
      <text x="230" y="11" class="val">12</text>
    </g>

