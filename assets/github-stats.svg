<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 180" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .bg { fill: #0c1017; rx: 8px; ry: 8px; stroke: #1e293b; stroke-width: 1px; }
      .title { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
      .label { fill: #94a3b8; font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 500; }
      .val { fill: #f8fafc; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; text-anchor: end; }
      .icon { fill: #00ff99; }
      .rank-circle { fill: none; stroke: #00ff99; stroke-width: 4px; stroke-dasharray: 120; stroke-dashoffset: 20; }
      .rank-text { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; text-anchor: middle; dom-dominant-baseline: central; }
    </style>
  </defs>

  <rect width="415" height="180" class="bg" />

