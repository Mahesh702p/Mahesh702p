<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      
      .card-bg { fill: #0c1017; rx: 8px; ry: 8px; stroke: #1e293b; stroke-width: 1px; }
      .repo-icon { fill: #00ff99; }
      .title { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
      .desc { fill: #94a3b8; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; }
      .meta-text { fill: #cbd5e1; font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 500; }
      .lang-js { fill: #f1e05a; }
      .lang-py { fill: #3572A5; }
      .star-icon { fill: #eab308; }
    </style>
  </defs>

  <!-- Left Card: Mahesh-Portfolio -->
  <g transform="translate(0, 0)">
    <a href="https://github.com/Mahesh702p/Mahesh-Portfolio" target="_blank">
      <rect width="415" height="170" class="card-bg" />
      
      <!-- Book Icon -->
      <path class="repo-icon" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM6 17V5h12v12H6z" transform="translate(20, 20) scale(0.8)" />
      
      <!-- Title -->
      <text x="48" y="34" class="title">Mahesh-Portfolio</text>
      
      <!-- Description -->
      <text x="20" y="65" class="desc">Interactive terminal-hacker portfolio featuring</text>
      <text x="20" y="83" class="desc">a custom shell, neofetch system summary, and</text>
      <text x="20" y="101" class="desc">dynamic theme engine.</text>
      
      <!-- Footer Metadata -->
      <!-- JS Dot -->
      <circle cx="26" cy="138" r="5" class="lang-js" />
      <text x="37" y="142" class="meta-text">JavaScript</text>
      
      <!-- Star Icon -->
      <path class="star-icon" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" transform="translate(130, 128) scale(0.65)" />
      <text x="148" y="142" class="meta-text">1</text>
    </a>
  </g>

  <!-- Right Card: CardVault -->
  <g transform="translate(435, 0)">
    <a href="https://github.com/Mahesh702p/CardVault" target="_blank">
      <rect width="415" height="170" class="card-bg" />
      
      <!-- Book Icon -->
      <path class="repo-icon" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM6 17V5h12v12H6z" transform="translate(20, 20) scale(0.8)" />
      
      <!-- Title -->
      <text x="48" y="34" class="title">CardVault</text>
      
      <!-- Description -->
      <text x="20" y="65" class="desc">High-performance card management vault</text>
      <text x="20" y="83" class="desc">analytics engine handling 1000+ cards</text>
      <text x="20" y="101" class="desc">with secure backend storage.</text>
      
      <!-- Footer Metadata -->
      <!-- Py Dot -->
      <circle cx="26" cy="138" r="5" class="lang-py" />
      <text x="37" y="142" class="meta-text">Python</text>
      
      <!-- Star Icon -->
      <path class="star-icon" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" transform="translate(100, 128) scale(0.65)" />
      <text x="118" y="142" class="meta-text">1</text>
    </a>
  </g>
</svg>
