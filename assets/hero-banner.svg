      <tspan x="0" dy="14">████╗ ████║██╔══██╗██║  ██║██╔════╝██╔════╝██║  ██║</tspan>
      <tspan x="0" dy="14">██╔████╔██║███████║███████║█████╗  ███████╗███████║</tspan>
      <tspan x="0" dy="14">██║╚██╔╝██║██╔══██║██╔══██║██╔══╝  ╚════██║██╔══██║</tspan>
      <tspan x="0" dy="14">██║ ╚═╝ ██║██║  ██║██║  ██║███████╗███████╗██║  ██║</tspan>
      <tspan x="0" dy="14">╚═╝     ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝╚══════╝╚═╝  ╚═╝</tspan>
    </text>
  </g>

  <!-- ASCII Art Sub (PATEL) -->
  <g transform="translate(235, 150)">
    <text class="ascii-sub">
      <tspan x="0" dy="12">██████╗  █████╗ ████████╗███████╗██╗     </tspan>
      <tspan x="0" dy="12">██╔══██╗██╔══██╗╚══██╔══╝██╔════╝██║     </tspan>
      <tspan x="0" dy="12">██████╔╝███████║   ██║   █████╗  ██║     </tspan>
      <tspan x="0" dy="12">██╔═══╝ ██╔══██║   ██║   ██╔══╝  ██║     </tspan>
      <tspan x="0" dy="12">██║     ██║  ██║   ██║   ███████╗███████╗</tspan>
      <tspan x="0" dy="12">╚═╝     ╚═╝  ╚═╝   ╚═╝   ╚══════╝╚══════╝</tspan>
    </text>
