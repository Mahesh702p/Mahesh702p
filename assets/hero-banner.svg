<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .bg { fill: #0c1017; stroke: #1e293b; stroke-width: 1.5px; rx: 10px; }
      .titlebar { fill: #161b22; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text { fill: #8b949e; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
      .ascii-green { fill: #00ff99; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12.5px; font-weight: 700; white-space: pre; }
      .ascii-sub { fill: #00ff99; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10.5px; font-weight: 700; white-space: pre; }
      .prompt-symbol { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: bold; }
      .prompt-text { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
      .bio-symbol { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: bold; }
