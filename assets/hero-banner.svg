<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&amp;display=swap');

      .bg-rect {
        fill: #0c1017;
        rx: 10px;
      }

      /* Animated Waving Background */
      .wave-path {
        fill: #14532d;
        opacity: 0.65;
      }

      @keyframes waveMove {
        0% {
          d: path("M0 80 Q 212.5 120 425 80 T 850 80 L 850 210 L 0 210 Z");
        }
        50% {
          d: path("M0 100 Q 212.5 60 425 100 T 850 100 L 850 210 L 0 210 Z");
        }
        100% {
          d: path("M0 80 Q 212.5 120 425 80 T 850 80 L 850 210 L 0 210 Z");
        }
      }

      .animated-wave {
        animation: waveMove 8s ease-in-out infinite;
      }

      .hero-title {
        fill: #00ff99;
        font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 68px;
        font-weight: 700;
        letter-spacing: 2px;
        text-anchor: middle;
        dominant-baseline: central;
        filter: drop-shadow(0 0 12px rgba(0, 255, 153, 0.3));
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="210" class="bg-rect" />

  <!-- Animated Wave Layer -->
  <path class="wave-path animated-wave" d="M0 80 Q 212.5 120 425 80 T 850 80 L 850 210 L 0 210 Z" />

  <!-- MAHESH PATEL in Ubuntu Font -->
  <text x="425" y="100" class="hero-title">MAHESH PATEL</text>
</svg>
