<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      
      .bg-main { fill: #0b0f17; }
      
      /* Left Hero Text */
      .ascii-name-main { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; white-space: pre; }
      .ascii-name-sub  { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; white-space: pre; }
      
      .prompt-symbol { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: bold; }
      .prompt-text   { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; }
      
      .bio-symbol { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: bold; }
      .bio-text   { fill: #94a3b8; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.6; }
      
      .connect-title { fill: #64748b; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .icon-circle { fill: #0b0f17; stroke: #00ff99; stroke-width: 1.5px; }
      .icon-path { fill: #00ff99; }

      /* Right Terminal Window */
      .term-window { fill: #111722; stroke: #1e2d42; stroke-width: 1.5px; rx: 12px; }
      
      /* Inner Neofetch Card */
      .neofetch-card { fill: #090d14; stroke: #1a2638; stroke-width: 1px; rx: 8px; }
      .badge-box { fill: #090d14; stroke: #00ff99; stroke-width: 1.2px; rx: 6px; }
      .badge-text { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
      
      .ascii-portrait { fill: #00ff99; font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 6.8px; font-weight: 500; white-space: pre; opacity: 0.95; }
      
      .info-label { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; }
      .info-val   { fill: #cbd5e1; font-family: 'JetBrains Mono', monospace; font-size: 11px; }

      /* Boot Input Box */
      .boot-box { fill: #080c12; stroke: #1e293b; stroke-width: 1px; rx: 6px; }
      .boot-hint { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .boot-hint-gray { fill: #64748b; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
      .boot-prompt { fill: #00ff99; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
      .cursor { fill: #00ff99; }
    </style>
  </defs>

